
spring:
  application:
    name: vestfatec

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/vestfatec}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

server:
  port: ${PORT:8080}
